<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="单词过关">
<meta name="theme-color" content="#3b82f6">
<title>单词过关</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{
  --blue:#4f6ef7; --indigo:#7c5cf0; --bg:#f4f6fb;
  --card:#fff; --text:#1f2937; --muted:#8a94a6; --line:#e8ebf2;
  --green:#16a34a; --red:#e11d48; --amber:#f59e0b;
  --shadow:0 1px 2px rgba(23,43,99,.04),0 4px 16px rgba(23,43,99,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
header{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(135deg,#4f6ef7,#7c5cf0);
  color:#fff; padding:16px 16px 14px; padding-top:calc(16px + env(safe-area-inset-top));
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 2px 12px rgba(79,110,247,.25);
}
header h1{font-size:21px; margin:0; font-weight:800; letter-spacing:.5px;}
header .sub{font-size:12px; opacity:.9; margin-top:2px; font-weight:500;}
.icon-btn{
  background:rgba(255,255,255,.2); border:none; color:#fff; font-size:20px;
  width:40px; height:40px; border-radius:12px; cursor:pointer; display:flex;
  align-items:center; justify-content:center; backdrop-filter:blur(4px);
}
main{max-width:640px; margin:0 auto; padding:16px 16px 24px;}
.tab{display:none;}
.tab.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.card{background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
.card h2{font-size:16px; margin:0 0 12px; color:var(--text); font-weight:700;}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
label{font-size:13px; color:var(--muted); font-weight:600;}
input[type=number],input[type=text],select{
  font-size:16px; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px;
  background:#fbfcfe; color:var(--text); width:100%; transition:.15s;
}
input[type=number]{width:72px; text-align:center;}
select{flex:1; min-width:0; appearance:none;}
input:focus,select:focus{outline:none; border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px rgba(79,110,247,.15);}
.btn{border:none; border-radius:13px; padding:12px 18px; font-size:15px; font-weight:700;
  cursor:pointer; transition:.15s; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.08);}
.btn:active{transform:scale(.97); box-shadow:none;}
.btn-primary{background:linear-gradient(135deg,#4f6ef7,#7c5cf0);}
.btn-green{background:var(--green);}
.btn-red{background:var(--red);}
.btn-amber{background:var(--amber);}
.btn-ghost{background:#fff; color:var(--text); border:1.5px solid var(--line); box-shadow:none;}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px; font-size:13px;}
.btn[disabled]{opacity:.45; pointer-events:none;}
.daily-item{
  display:flex; align-items:center; gap:12px; padding:11px 12px;
  background:#fafbfe; border:1px solid var(--line); border-radius:14px; margin-bottom:8px;
}
.daily-item .no{
  width:28px; height:28px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,#4f6ef7,#7c5cf0); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
}
.daily-item .dw{flex:1; min-width:0;}
.daily-item .en{font-weight:700; font-size:16px; color:var(--text); word-break:break-word;}
.daily-item .cn{color:var(--muted); font-size:13.5px; word-break:break-word; margin-top:1px;}
.word-item{display:flex; align-items:baseline; gap:8px; padding:8px 4px; border-bottom:1px solid #f0f1f3;}
.word-item:last-child{border-bottom:none;}
.word-item .no{color:var(--muted); font-size:12px; min-width:22px; text-align:right; flex-shrink:0;}
.word-item .en{font-weight:700; color:var(--indigo); word-break:break-word;}
.word-item .cn{color:var(--text); word-break:break-word; flex:1;}
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  display:flex; background:rgba(255,255,255,.92); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px rgba(23,43,99,.04);
}
.tabbar button{flex:1; background:none; border:none; padding:10px 0 8px; cursor:pointer;
  font-size:12px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; font-weight:600;}
.tabbar button .ico{font-size:22px; transition:transform .15s;}
.tabbar button.active{color:var(--blue); font-weight:700;}
.tabbar button.active .ico{transform:translateY(-1px) scale(1.1);}
.practice-stage{background:var(--card); border-radius:18px; padding:22px 18px; margin-bottom:14px; box-shadow:var(--shadow);}
.progress{font-size:13px; color:var(--muted); margin-bottom:8px; font-weight:600;}
.progressbar{height:8px; background:#e8ebf2; border-radius:4px; overflow:hidden; margin-bottom:16px;}
.progressbar>div{height:100%; background:linear-gradient(90deg,#4f6ef7,#7c5cf0); border-radius:4px; transition:width .35s ease;}
.q-label{font-size:13px; color:var(--muted); margin-bottom:8px; font-weight:600;}
.q-main{font-size:24px; font-weight:800; margin-bottom:16px; word-break:break-word; line-height:1.4;}
.result{font-size:15px; padding:13px 14px; border-radius:12px; margin-top:14px; display:none;}
.result.ok{display:block; background:#eafaf0; color:var(--green); border:1px solid #b7e6c8; animation:pop .32s ease;}
.result.no{display:block; background:#fdeef1; color:var(--red); border:1px solid #f5c2cc; animation:shake .4s ease;}
.result .ans{font-weight:700; font-size:17px; margin-top:4px; color:var(--text);}
.result .cn-ref{font-size:14px; color:var(--muted); margin-top:2px;}
@keyframes pop{0%{transform:scale(.94);}55%{transform:scale(1.03);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}}
.score-bar{display:flex; gap:8px; margin-bottom:14px;}
.score-box{flex:1; background:var(--card); border-radius:14px; padding:12px 10px; text-align:center; box-shadow:var(--shadow);}
.score-box .num{font-size:24px; font-weight:800; color:var(--indigo);}
.score-box .lbl{font-size:11px; color:var(--muted); font-weight:600;}
.mode-toggle{display:flex; background:#eef0f6; border-radius:14px; padding:4px; margin-bottom:14px;}
.mode-toggle button{flex:1; border:none; background:none; padding:10px; font-size:14px; border-radius:11px;
  cursor:pointer; color:var(--muted); font-weight:700; transition:.15s;}
.mode-toggle button.active{background:#fff; color:var(--blue); box-shadow:0 1px 4px rgba(23,43,99,.1);}
.stat-grid{display:flex; gap:10px; margin-bottom:14px;}
.stat{flex:1; background:var(--card); border-radius:16px; padding:14px 10px; text-align:center; box-shadow:var(--shadow);}
.stat .n{font-size:24px; font-weight:800; color:var(--indigo);}
.stat .t{font-size:12px; color:var(--muted); font-weight:600; margin-top:2px;}
.src-row{display:flex; justify-content:space-between; align-items:center; padding:8px 2px; border-bottom:1px solid #f0f1f3; font-size:13px;}
.src-row .name{flex:1; word-break:break-all;}
.src-row .cnt{color:var(--muted); margin-right:8px; white-space:nowrap;}
.src-row .del{color:var(--red); font-size:12px; background:none; border:none; cursor:pointer;}
.bank-item{display:flex; align-items:baseline; gap:8px; padding:9px 4px; border-bottom:1px solid #f0f1f3; font-size:14px;}
.bank-item .en{font-weight:700; color:var(--indigo); word-break:break-word; min-width:0;}
.bank-item .cn{color:var(--text); flex:1; word-break:break-word;}
.bank-item .src{font-size:10px; color:var(--muted); background:#f0f1f3; padding:1px 6px; border-radius:6px; white-space:nowrap;}
.bank-item .x{color:#cbd5e1; font-size:18px; cursor:pointer; padding:0 4px; background:none; border:none;}
.bank-item .x:active{color:var(--red);}
.file-drop{border:2px dashed #cbd5e1; border-radius:14px; padding:20px; text-align:center;
  color:var(--muted); font-size:14px; cursor:pointer; margin-bottom:12px; transition:.15s;}
.file-drop.hover{border-color:var(--blue); background:#eff4ff;}
.file-drop input{display:none;}
.modal-mask{position:fixed; inset:0; background:rgba(17,24,39,.5); z-index:50; display:none;
  align-items:center; justify-content:center; padding:24px;}
.modal-mask.show{display:flex;}
.modal{background:#fff; border-radius:20px; padding:22px; max-width:340px; width:100%; text-align:center;}
.modal h3{margin:0 0 4px; font-size:17px;}
.modal p{font-size:13px; color:var(--muted); margin:6px 0;}
.modal .url{font-size:14px; font-weight:700; color:var(--indigo); word-break:break-all; margin:10px 0;}
#toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:rgba(17,24,39,.92); color:#fff; padding:11px 20px; border-radius:22px; font-size:14px;
  z-index:99; opacity:0; pointer-events:none; transition:opacity .25s; max-width:86%; text-align:center;}
#toast.show{opacity:1;}
.empty{text-align:center; color:var(--muted); padding:34px 10px; font-size:14px;}
.badge{display:inline-block; background:#eef2ff; color:var(--indigo); font-size:11px; padding:3px 9px;
  border-radius:20px; margin-left:6px; vertical-align:middle; font-weight:600;}
.src-label{font-size:14px; color:var(--muted); font-weight:600; padding:9px 12px; cursor:pointer;
  border:1.5px solid var(--line); border-radius:12px; background:#fbfcfe; display:flex; align-items:center; gap:6px;}
.src-label b{color:var(--text); font-weight:700;}
.src-label .arrow{margin-left:auto; transition:transform .2s;}
.src-label.open .arrow{transform:rotate(180deg);}
.src-panel{background:#fafbfe; border:1px solid var(--line); border-radius:12px; padding:6px; margin-top:8px;}
.src-panel label{display:flex; align-items:center; gap:10px; padding:9px 10px; font-size:14px; color:var(--text); cursor:pointer; border-radius:9px;}
.src-panel label:active{background:#eef1f7;}
.src-panel input{width:18px; height:18px; accent-color:var(--blue); flex-shrink:0;}
.src-panel .cnt{color:var(--muted); font-size:12px; margin-left:auto;}
.pos-tag{display:inline-block; background:#eef2ff; color:var(--indigo); font-size:11px; padding:2px 8px;
  border-radius:6px; font-weight:700; margin-left:8px; vertical-align:middle; flex-shrink:0;}
.ring-wrap{display:flex; flex-direction:column; align-items:center; margin-bottom:14px;}
.ring{position:relative; width:132px; height:132px; border-radius:50%;
  background:conic-gradient(var(--indigo) calc(var(--p)*1%), #e8ebf2 0);
  display:flex; align-items:center; justify-content:center;}
.ring::before{content:''; position:absolute; inset:12px; background:#fff; border-radius:50%;}
.ring .ring-inner{position:relative; text-align:center;}
.ring .ring-inner .pct{font-size:30px; font-weight:800; color:var(--indigo); line-height:1;}
.ring .ring-inner .lbl{font-size:11px; color:var(--muted); margin-top:2px;}
</style>
</head>
<body>

<header>
  <div>
    <h1>单词过关</h1>
    <div class="sub" id="bankCount">加载中…</div>
  </div>
  <button class="icon-btn" id="infoBtn" title="关于">ℹ️</button>
</header>

<main>
  <section id="tab-daily" class="tab active">
    <div class="card">
      <h2>生成今日清单</h2>
      <div class="row" style="margin-bottom:12px;">
        <label>数量</label>
        <input type="number" id="dailyCount" value="20" min="1" max="200">
      </div>
      <div class="src-label" id="srcLabel">📂 来源：<b id="srcText">全部</b><span id="srcHint"></span><span class="arrow">▾</span></div>
      <div class="src-panel" id="srcPanel" style="display:none;"></div>
      <button class="btn btn-primary btn-block" id="genBtn" style="margin-top:12px;">🎯 生成清单</button>
    </div>
    <div class="card" id="lastListCard" style="display:none;">
      <h2>📌 上次清单 <span id="lastDate" class="badge"></span></h2>
      <div style="font-size:13px; color:var(--muted); margin-bottom:10px;" id="lastInfo"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" style="flex:1;" id="reviewLastBtn">✏️ 温习练习</button>
        <button class="btn btn-amber" style="flex:1;" id="dlLastMoxie">下载默写单</button>
      </div>
    </div>
    <div id="dailyResult"></div>
  </section>

  <section id="tab-practice" class="tab">
    <div class="card">
      <h2>选择练习模式</h2>
      <div class="mode-toggle" id="modeToggle">
        <button data-mode="cn2en" class="active">看中文 · 写英文</button>
        <button data-mode="en2cn">看英文 · 写中文</button>
      </div>
      <div class="row" style="margin-bottom:12px;">
        <label>数量</label>
        <input type="number" id="practiceCount" value="10" min="1" max="100">
        <span style="font-size:12px;color:var(--muted)">随机抽词</span>
      </div>
      <button class="btn btn-primary btn-block" id="startBtn">▶ 开始练习</button>
      <button class="btn btn-ghost btn-block" id="practiceTodayBtn" style="margin-top:8px; display:none;">
        📋 练习今日清单
      </button>
      <button class="btn btn-ghost btn-block" id="wrongReviewBtn" style="margin-top:8px; display:none;">
        🔁 复习错题
      </button>
    </div>
    <div id="practiceArea"></div>
  </section>

  <section id="tab-bank" class="tab">
    <div class="stat-grid" id="statGrid"></div>
    <div class="card">
      <h2>添加单词（上传文件）</h2>
      <div class="file-drop" id="fileDrop">
        📄 点击或拖入文件，向词库添加单词<br>
        <span style="font-size:12px;">支持 .docx / .txt / .json / .md（.doc 请先另存为 .docx）</span>
        <input type="file" id="fileInput" accept=".docx,.doc,.txt,.json,.md" multiple>
      </div>
    </div>
    <div class="card" id="srcCard" style="display:none;">
      <h2>来源管理</h2>
      <div id="srcList"></div>
    </div>
    <div class="card">
      <h2>词库检索</h2>
      <input type="text" id="searchBox" placeholder="输入英文或中文搜索…" style="margin-bottom:10px;">
      <div id="bankList"></div>
      <button class="btn btn-ghost btn-block" id="loadMoreBtn" style="margin-top:10px; display:none;">加载更多</button>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="daily" class="active"><span class="ico">📋</span>今日清单</button>
  <button data-tab="practice"><span class="ico">✏️</span>练习</button>
  <button data-tab="bank"><span class="ico">📚</span>词库</button>
</nav>

<div class="modal-mask" id="infoModal">
  <div class="modal">
    <h3>单词过关</h3>
    <p>词库全部来自你上传的文件，数据只存在本机浏览器中。</p>
    <p style="font-size:12px;">💡 下载的 .docx 会存进手机的「文件 → 下载」文件夹</p>
    <button class="btn btn-ghost btn-block" id="infoClose">关闭</button>
  </div>
</div>

<div id="toast"></div>

function splitLine(line){

function cnFragments(cn){
  cn=(cn||'').replace(/\n/g,'；');
  var out=[];
  cn.split('；').forEach(function(f){
    f=f.replace(/^[a-zA-Z]{1,6}[.．]?\s*/,'').trim();
    if(f && out.indexOf(f)<0) out.push(f);
  });
  return out;
}
function mergeCn(a,b){
  var frags=cnFragments(a).concat(cnFragments(b));

  return seen.join('；');
}
function mergePairs(pairs, source){

  pairs.forEach(function(p){
    var en=(p[0]||'').trim(), cn=(p[1]||'').trim();
    if(!en||!cn){ skipped++; return; }
    var key=normalizeKey(en);
    if(key in idx){
      var w=bank[idx[key]];
      if(w.sources.indexOf(source)<0) w.sources.push(source);
      w.cn=mergeCn(w.cn, cn);
      updated++;

  var out='';
  words.forEach(function(w,i){
    var prompt=(w.pos?w.pos+' ':'')+w.cn;
    out+=para(run((i+1)+'. ', false, 21)+run(prompt, false, 21), 'left', 100, 20);
    out+=para(run('＿'.repeat(48), false, 21), 'left', 0, 60);
  });
  return out;
}
function makeDocxBlob(mode, words, title){
  var d=new Date();
  var dateStr=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  var sub = mode==='duizhao' ? ('中英对照 · '+dateStr+' · 共 '+words.length+' 词') : ('根据中文默写英文 · '+dateStr+' · 共 '+words.length+' 词');
  var body='';
  body+=para(run(title||'单词过关', true, 30), 'center', 0, 40);
  body+=para(run(sub, false, 20), 'center', 0, 160);
  if(mode==='duizhao'){
    body+=duizhaoTable(words);
  } else {
    body+=moxieList(words);
    body+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
    body+=para(run('参考答案', true, 28), 'center', 0, 160);
    body+=duizhaoTable(words);
  }
  var documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'
    +body
    +'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="850" w:right="907" w:bottom="850" w:left="907"/></w:sectPr>'
    +'</w:body></w:document>';
  var contentTypes='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    +'</Types>';
  var rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
    +'</Relationships>';
  var docRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
  var files={
    '[Content_Types].xml': F.strToU8(contentTypes),
    '_rels/.rels': F.strToU8(rels),
    'word/document.xml': F.strToU8(documentXml),
    'word/_rels/document.xml.rels': F.strToU8(docRels)
  };
  var zipped=F.zipSync(files,{level:6});
  return new Blob([zipped],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

// ================= 渲染 =================
function computeSources(){
  var cnt={}; bank.forEach(function(w){ w.sources.forEach(function(s){ cnt[s]=(cnt[s]||0)+1; }); });
  return Object.keys(cnt).map(function(k){ return {name:k,count:cnt[k]}; }).sort(function(a,b){return b.count-a.count;});
}
function refreshAll(){
  $('#bankCount').textContent='词库共 '+bank.length+' 词';
  renderSourcePanel(); renderStats(); renderSrcList(); applyFilter();
}
function updateSrcLabel(){
  if(selectedSources.length===0){
    $('#srcText').textContent='全部';
    $('#srcHint').textContent='（'+bank.length+'词）';
  } else {
    var cnt=bank.filter(function(w){ return w.sources.some(function(s){ return selectedSources.indexOf(s)>=0; }); }).length;
    $('#srcText').textContent=selectedSources.length+' 个来源';
    $('#srcHint').textContent='（'+cnt+'词）';
  }
}
function renderSourcePanel(){
  var srcs=computeSources();
  $('#srcPanel').innerHTML='<label><input type="checkbox" id="srcAll" '+(selectedSources.length===0?'checked':'')+'> 全部来源 <span class="cnt">'+bank.length+'词</span></label>'
    +srcs.map(function(s){
      return '<label><input type="checkbox" class="src-cb" value="'+escapeHtml(s.name)+'" '+(selectedSources.indexOf(s.name)>=0?'checked':'')+'> '+escapeHtml(s.name)+' <span class="cnt">'+s.count+'词</span></label>';
    }).join('');
  updateSrcLabel();
  $('#srcAll').onchange=function(){ if(this.checked){ selectedSources=[]; } renderSourcePanel(); };
  $('#srcPanel').querySelectorAll('.src-cb').forEach(function(cb){
    cb.onchange=function(){
      if(cb.checked){ if(selectedSources.indexOf(cb.value)<0) selectedSources.push(cb.value); }
      else { selectedSources=selectedSources.filter(function(x){ return x!==cb.value; }); }
      renderSourcePanel();
    };
  });
}
function renderStats(){
  $('#statGrid').innerHTML='<div class="stat"><div class="n">'+bank.length+'</div><div class="t">📚 总词条</div></div>'
    +'<div class="stat"><div class="n">'+computeSources().length+'</div><div class="t">📄 来源</div></div>'
    +'<div class="stat"><div class="n">'+wrongBank.length+'</div><div class="t">❌ 错题</div></div>';
}
function renderSrcList(){
  var card=$('#srcCard'), srcs=computeSources();
  if(!srcs.length){ card.style.display='none'; return; }
  card.style.display='block';
  $('#srcList').innerHTML=srcs.map(function(s){
    return '<div class="src-row"><span class="name">'+escapeHtml(s.name)+'</span><span class="cnt">'+s.count+'词</span><button class="del" data-src="'+escapeHtml(s.name)+'">删除</button></div>';
  }).join('');
  $('#srcList').querySelectorAll('.del').forEach(function(b){
    b.onclick=function(){
      if(!confirm('确定删除来源「'+b.dataset.src+'」的全部单词？')) return;
      var src=b.dataset.src;
      bank=bank.filter(function(w){ return w.sources.indexOf(src)<0; });
      saveWords(); refreshAll(); toast('已删除该来源');
    };
  });
}
function applyFilter(){
  var q=searchTerm.trim().toLowerCase();
  filteredBank=bank.filter(function(w){
    if(!q) return true;
    return w.en.toLowerCase().indexOf(q)>=0 || w.cn.indexOf(q)>=0;
  });
  listLimit=60; renderBankList();
}
function renderBankList(){
  var box=$('#bankList');
  var slice=filteredBank.slice(0,listLimit);
  if(!slice.length){ box.innerHTML='<div class="empty">没有匹配的单词</div>'; $('#loadMoreBtn').style.display='none'; return; }
  box.innerHTML=slice.map(function(w){
    return '<div class="bank-item"><span class="en">'+escapeHtml(w.en)+'</span><span class="cn">'+escapeHtml(w.cn)+'</span>'
      +'<span class="src">'+w.sources.length+'源</span>'
      +'<button class="x" data-key="'+encodeURIComponent(normalizeKey(w.en))+'">✕</button></div>';
  }).join('');
  $('#loadMoreBtn').style.display=filteredBank.length>listLimit?'block':'none';
  box.querySelectorAll('.x').forEach(function(x){
    x.onclick=function(){
      var key=decodeURIComponent(x.dataset.key);
      bank=bank.filter(function(w){ return normalizeKey(w.en)!==key; });
      saveWords(); refreshAll(); toast('已删除');
    };
  });
}

// ================= 今日清单 =================
function generateDaily(){
  var n=parseInt($('#dailyCount').value)||20;
  var pool=bank.filter(function(w){
    if(selectedSources.length===0) return true;
    return w.sources.some(function(s){ return selectedSources.indexOf(s)>=0; });
  });
  if(!pool.length){ toast('所选来源没有单词'); return; }
  if(n>pool.length){ toast('词库只有 '+pool.length+' 词'); }
  todayList=shuffle(pool).slice(0,n).map(function(w){ return {en:w.en, cn:w.cn, pos:w.pos||''}; });
  renderDaily();
  saveLastList();
  renderLastCard();
}
function renderDaily(){
  var box=$('#dailyResult');
  if(!todayList.length){ box.innerHTML=''; return; }
  box.innerHTML='<div class="card"><h2>今日清单 <span class="badge">'+todayList.length+' 词</span></h2>'
    +'<div style="display:flex; gap:8px; margin-bottom:8px;">'
    +'<button class="btn btn-green" style="flex:1;" id="dlDz">下载中英对照</button>'
    +'<button class="btn btn-amber" style="flex:1;" id="dlMx">下载默写单</button></div>'
    +'<button class="btn btn-primary btn-block" id="goPractice" style="margin-bottom:10px;">✏️ 用这组词练习</button>'
    +'<div id="dailyList">'+todayList.map(function(w,i){
      return '<div class="daily-item"><span class="no">'+(i+1)+'</span><div class="dw"><div class="en">'+escapeHtml(w.en)+(w.pos?'<span class="pos-tag">'+escapeHtml(w.pos)+'</span>':'')+'</div><div class="cn">'+escapeHtml(w.cn)+'</div></div></div>';
    }).join('')+'</div></div>';
  $('#dlDz').onclick=function(){ downloadDoc('duizhao'); };
  $('#dlMx').onclick=function(){ downloadDoc('moxie'); };
  $('#goPractice').onclick=function(){ pQueue=todayList.slice(); pMode=$('#modeToggle .active').dataset.mode; startPractice(); };
  box.scrollIntoView({behavior:'smooth'});
}
function downloadDoc(mode, words){
  words = words || todayList;
  if(!words.length){ toast('先生成清单'); return; }
  if(!F){ toast('无法生成 docx'); return; }
  toast('正在生成文档…');
  try{
    var blob=makeDocxBlob(mode, words, '单词过关');
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download = mode==='duizhao'?'单词过关_中英对照.docx':'单词过关_默写单.docx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  }catch(e){ toast('生成失败：'+e.message); }
}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function saveLastList(){
  try{ localStorage.setItem('wp_last_list', JSON.stringify({date:todayStr(), words:todayList})); }catch(e){}
}
function loadLastList(){
  try{
    var raw=localStorage.getItem('wp_last_list');
    if(raw){ var d=JSON.parse(raw); if(d && d.words && d.words.length) return d; }
  }catch(e){}
  return null;
}
function renderLastCard(){
  var last=loadLastList();
  var card=$('#lastListCard');
  if(!last){ card.style.display='none'; return; }
  card.style.display='block';
  $('#lastDate').textContent=last.date||'';
  $('#lastInfo').textContent='共 '+last.words.length+' 词 · 可温习或重新下载';
}

// ================= 练习 =================
function startPractice(){
  pIndex=0; pScore=0; pWrong=[]; 
  if(!pQueue.length){ toast('没有可练习的单词'); return; }
  pQueue=shuffle(pQueue);
  switchTab('practice'); renderPractice();
}
function renderPractice(){
  var box=$('#practiceArea');
  if(pIndex>=pQueue.length){ renderFinish(); return; }
  var w=pQueue[pIndex], total=pQueue.length;
  box.innerHTML='<div class="score-bar">'
    +'<div class="score-box"><div class="num">'+pIndex+'</div><div class="lbl">已做</div></div>'
    +'<div class="score-box"><div class="num">'+(pIndex-pScore-pWrong.length)+'</div><div class="lbl">跳过</div></div>'
    +'<div class="score-box"><div class="num">'+pScore+'</div><div class="lbl">答对</div></div></div>'
    +'<div class="practice-stage"><div class="progress">第 '+(pIndex+1)+' / '+total+' 题</div>'
    +'<div class="progressbar"><div style="width:'+(pIndex/total*100)+'%"></div></div>'
    +(pMode==='cn2en'?cn2enHTML(w):en2cnHTML(w))+'</div>';
  if(pMode==='cn2en'){
    $('#answerInput').addEventListener('keydown',function(e){ if(e.key==='Enter') checkCn2en(); });
    $('#checkBtn').onclick=checkCn2en; $('#skipBtn').onclick=nextQuestion;
  }else{
    $('#answerInput').addEventListener('keydown',function(e){ if(e.key==='Enter') revealCn(); });
    $('#revealBtn').onclick=revealCn; $('#skipBtn').onclick=nextQuestion;
  }
}
function cn2enHTML(w){
  return '<div class="q-label">请写出英文'+(w.pos?'　<span class="pos-tag">'+escapeHtml(w.pos)+'</span>':'')+'</div><div class="q-main">'+escapeHtml(w.cn)+'</div>'
    +'<input type="text" id="answerInput" placeholder="输入英文…" autocapitalize="off" autocorrect="off" spellcheck="false">'
    +'<div style="display:flex; gap:8px; margin-top:12px;">'
    +'<button class="btn btn-primary" id="checkBtn" style="flex:1;">检查</button>'
    +'<button class="btn btn-ghost" id="skipBtn">跳过</button></div><div id="resultBox"></div>';
}
function en2cnHTML(w){
  return '<div class="q-label">请说出中文含义（可写下来或默念）</div><div class="q-main">'+escapeHtml(w.en)+'</div>'
    +'<input type="text" id="answerInput" placeholder="输入中文（可选）…">'
    +'<div style="display:flex; gap:8px; margin-top:12px;">'
    +'<button class="btn btn-primary" id="revealBtn" style="flex:1;">显示答案</button>'
    +'<button class="btn btn-ghost" id="skipBtn">跳过</button></div><div id="resultBox"></div>';
}
function checkCn2en(){
  var w=pQueue[pIndex];
  var user=normEn($('#answerInput').value), correct=normEn(w.en);
  var ok=user && user===correct;
  var box=$('#resultBox');
  if(ok){ pScore++; box.innerHTML='<div class="result ok">✓ 正确！<div class="ans">'+escapeHtml(w.en)+'</div></div>'; }
  else{
    pWrong.push(w);
    box.innerHTML='<div class="result no">✗ 答错了<div class="ans">正确答案：'+escapeHtml(w.en)+'</div>'
      +(user?'<div class="cn-ref">你写的：'+escapeHtml($('#answerInput').value)+'</div>':'')+'</div>';
  }
  $('#answerInput').disabled=true;
  var cb=$('#checkBtn'); cb.textContent='下一题'; cb.onclick=nextQuestion;
}
function revealCn(){
  var w=pQueue[pIndex];
  $('#resultBox').innerHTML='<div class="result" style="display:block;background:#eff6ff;color:var(--indigo);">'
    +'<div class="ans">'+escapeHtml(w.en)+'</div><div class="cn-ref">'+escapeHtml(w.cn)+'</div></div>'
    +'<div style="display:flex; gap:8px; margin-top:12px;">'
    +'<button class="btn btn-green" id="okBtn" style="flex:1;">✓ 我答对了</button>'
    +'<button class="btn btn-red" id="badBtn" style="flex:1;">✗ 我答错了</button></div>';
  $('#revealBtn').style.display='none'; $('#answerInput').disabled=true;
  $('#okBtn').onclick=function(){ markAnswer(true); };
  $('#badBtn').onclick=function(){ markAnswer(false); };
}
function markAnswer(ok){ var w=pQueue[pIndex]; if(ok) pScore++; else pWrong.push(w); nextQuestion(); }
function nextQuestion(){ pIndex++; renderPractice(); }
function renderFinish(){
  var total=pQueue.length;
  var rate=total?Math.round(pScore/total*100):0;
  var wrongHtml='';
  if(pWrong.length){
    pWrong.forEach(function(w){ var k=normalizeKey(w.en); if(!wrongBank.some(function(x){return normalizeKey(x.en)===k;})) wrongBank.push(w); });
    saveWrong();
    wrongHtml='<div class="card"><h2>错题 ('+pWrong.length+')</h2>'
      +pWrong.map(function(w,i){ return '<div class="word-item"><span class="no">'+(i+1)+'</span><span class="en">'+escapeHtml(w.en)+'</span><span class="cn">'+escapeHtml(w.cn)+'</span></div>'; }).join('')
      +'<button class="btn btn-amber btn-block" id="redoWrong" style="margin-top:10px;">🔁 错题重练</button></div>';
  }
  var box=$('#practiceArea');
  box.innerHTML='<div class="card" style="text-align:center;">'
    +'<div style="font-size:44px;">'+(rate>=80?'🎉':rate>=60?'😊':'💪')+'</div>'
    +'<div class="ring-wrap"><div class="ring" style="--p:'+rate+'"><div class="ring-inner"><div class="pct">'+rate+'%</div><div class="lbl">正确率</div></div></div></div>'
    +'<div style="font-size:22px; font-weight:800; color:var(--text); margin-bottom:4px;">'+pScore+' / '+total+'</div>'
    +'<div style="color:var(--muted); margin-bottom:14px; font-size:13px;">答对 '+pScore+' 题 · 共 '+total+' 题</div>'
    +'<button class="btn btn-primary btn-block" id="againBtn">再来一组</button></div>'+wrongHtml;
  $('#againBtn').onclick=function(){
    var n=parseInt($('#practiceCount').value)||10;
    pQueue=shuffle(bank).slice(0,n).map(function(w){return {en:w.en,cn:w.cn,pos:w.pos||''};});
    startPractice();
  };
  if(pWrong.length){ $('#redoWrong').onclick=function(){ pQueue=pWrong.slice(); startPractice(); }; }
}

// ================= 上传 =================
function handleFiles(files){ Array.prototype.forEach.call(files, function(f){ uploadFile(f); }); }
function uploadFile(file){
  var name=file.name||'';
  var ext=(name.split('.').pop()||'').toLowerCase();
  toast('解析「'+name+'」…');
  var done=function(pairs, err){
    if(err){ toast('✗ '+err); return; }
    if(!pairs.length){ toast('✗ 未解析出任何词条'); return; }
    var r=mergePairs(pairs, name);
    saveWords(); refreshAll();
    toast('✓ +'+r.added+' 新词，合并 '+r.updated+'，跳过 '+r.skipped+'，共 '+r.total+' 词');
  };
  if(ext==='json'){
    file.text().then(function(t){
      try{ done(parseJson(JSON.parse(t))); }
      catch(e){ done([], 'JSON 解析失败'); }
    }).catch(function(){ done([], '读取失败'); });
  } else if(ext==='docx'||ext==='doc'){
    file.arrayBuffer().then(function(ab){
      var pairs=parseDocxBuffer(new Uint8Array(ab));
      if(!pairs.length) done([], '无法解析（.doc 请另存为 .docx）');
      else done(pairs);
    }).catch(function(){ done([], '读取失败'); });
  } else {
    file.text().then(function(t){ done(parseText(t)); }).catch(function(){ done([], '读取失败'); });
  }
}

// ================= tab / 模态 =================
function switchTab(name){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.tabbar button').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===name); });
  $('#tab-'+name).classList.add('active');
  if(name==='bank') applyFilter();
  if(name==='practice'){
    $('#practiceTodayBtn').style.display=todayList.length?'block':'none';
    $('#wrongReviewBtn').style.display=wrongBank.length?'block':'none';
  }
}

// ================= 初始化 =================
function init(){
  try{ wrongBank=JSON.parse(localStorage.getItem('wp_wrong')||'[]')||[]; }catch(e){ wrongBank=[]; }
  bank=loadWords(); saveWords();

  document.querySelectorAll('.tabbar button').forEach(function(b){ b.onclick=function(){ switchTab(b.dataset.tab); }; });
  $('#genBtn').onclick=generateDaily;
  renderLastCard();
  $('#reviewLastBtn').onclick=function(){
    var last=loadLastList();
    if(last && last.words){ pQueue=last.words.slice(); pMode=$('#modeToggle .active').dataset.mode; startPractice(); }
    else { toast('还没有上次清单，先生成一次'); }
  };
  $('#dlLastMoxie').onclick=function(){
    var last=loadLastList();
    if(last && last.words){ downloadDoc('moxie', last.words); }
    else { toast('还没有上次清单'); }
  };
  $('#srcLabel').onclick=function(){
    var p=$('#srcPanel'); var show=p.style.display==='none';
    p.style.display=show?'block':'none';
    $('#srcLabel').classList.toggle('open', show);
  };
  $('#startBtn').onclick=function(){
    var n=parseInt($('#practiceCount').value)||10;
    pQueue=shuffle(bank).slice(0,n).map(function(w){return {en:w.en,cn:w.cn,pos:w.pos||''};});
    pMode=$('#modeToggle .active').dataset.mode;
    startPractice();
  };
  $('#practiceTodayBtn').onclick=function(){ pQueue=todayList.slice(); pMode=$('#modeToggle .active').dataset.mode; startPractice(); };
  $('#wrongReviewBtn').onclick=function(){ pQueue=wrongBank.slice(); pMode=$('#modeToggle .active').dataset.mode; startPractice(); };
  $('#modeToggle').querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      $('#modeToggle').querySelectorAll('button').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
    };
  });
  $('#searchBox').oninput=function(e){ searchTerm=e.target.value; listLimit=60; renderBankList(); };
  $('#loadMoreBtn').onclick=function(){ listLimit+=60; renderBankList(); };

  var drop=$('#fileDrop'), input=$('#fileInput');
  drop.onclick=function(){ input.click(); };
  input.onchange=function(e){ handleFiles(e.target.files); e.target.value=''; };
  ['dragover','dragenter'].forEach(function(ev){ drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.add('hover'); }); });
  ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.remove('hover'); }); });
  drop.addEventListener('drop',function(e){ if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

  $('#infoBtn').onclick=function(){ $('#infoModal').classList.add('show'); };
  $('#infoClose').onclick=function(){ $('#infoModal').classList.remove('show'); };
  $('#infoModal').addEventListener('click',function(e){ if(e.target===e.currentTarget) $('#infoModal').classList.remove('show'); });

  refreshAll();

  // 注册 Service Worker（仅 https 或 localhost）
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}
init();
})();
</script>
